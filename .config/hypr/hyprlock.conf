general {
    grace = 0
    disable_loading_bar = true
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 1
    blur_size = 4
}

label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.9)
    font_size = 64
    font_family = sans-serif
    position = 0, -100
    halign = center
    valign = top
}

# Поле ввода пароля с точками и красной рамкой при ошибке
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 3      # толщина рамки
    dots_size = 0.3            # размер точек
    dots_spacing = 0.5        # расстояние между точками
    dots_center = true
    fade_on_empty = false      # точки видны всегда, а не только при вводе

    placeholder_text = 

    # Цвета рамки
    outer_color = rgba(255, 255, 255, 0.15)   # обычная рамка
    inner_color = rgba(0, 0, 0, 0.4)         # фон внутри поля
    font_color = rgba(255, 255, 255, 0.8)

    # Цвет рамки при неверном пароле
    fail_color = rgba(255, 0, 0, 0.8)
    fail_text = 

    rounding = 10
    position = 0, 0
    halign = center
    valign = center
}
