source = ~/.config/hypr/hyprlock/colors.conf

general {
    ignore_empty_input = true
    hide_cursor = true
    fail_timeout = 500
}

background {
    path = screenshot
    blur_passes = 3
    blur_size = 4
}

label {
    text = $TIME
    color = $on_surface
    font_size = 90
    font_family = JetBrains Mono Nerd Font Bold
    position = 0, 150
}

label {
    text = cmd[update:0] echo "$(date +'%d %B')"
    color = $on_surface
    font_size = 20
    font_family = JetBrains Mono Nerd Font

    position = 0, 75
}

input-field {
    position = 0, -75
    size = 400, 80
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.5
    dots_center = true
    fade_on_empty = false

    placeholder_text = 
    fail_text = 

    outer_color = $outline_variant
    inner_color = $surface
    check_color = $outline_variant
    font_color = $on_surface
    fail_color = $error

    rounding = 30
}
